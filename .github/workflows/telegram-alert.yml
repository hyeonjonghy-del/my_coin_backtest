name: Telegram BTC exposure alert

on:
  schedule:
    # Upbit's daily candle closes at 00:00 UTC (09:00 KST).
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check model exposure and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alert.py
